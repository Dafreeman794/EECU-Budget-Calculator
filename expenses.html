<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/IMages/images 1.png">
</head>
<body>
    <nav>
        <a href="index.html" id="income-1">
            <img src="/IMages/images 1.png" alt="EECU Logo">
        </a>
    </nav>
    <section class="net-income">
        <h1>Your current Net Income: <br> <span id="displayNet">(Net)</span></h1>
        <p>Congrats! Now we have to fill out post-income necessities.</p>
    
        <form id="userExpenses">
            <div class="expense-row">
                <label for="rent" class="label-box">
                    <img src="./IMages/Home.svg" alt="Home">
                    <span>Rent/Mortgage</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter a mortgage">
            </div>
    
            <div class="expense-row">
                <label for="vehicle" class="label-box">
                    <img src="./IMages/Car.svg">
                    <span>Vehicle Payment</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter transportation payments">
            </div>
    
            <div class="expense-row">
                <label for="food" class="label-box">
                    <img src="./IMages/Shopping cart.svg">
                    <span>Food/Edibles</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter Food expenses">
            </div>

            <div class="expense-row">
                <label for="cloths" class="label-box">
                    <img src="./IMages/Shopping cart.svg">
                    <span>Clothing</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter clothing expenses">
            </div>

            <div class="expense-row">
                <label for="Utils" class="label-box">
                    <img src="./IMages/Utilities.svg">
                    <span>Utilities</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter Utility expenses">
            </div>
            
            <div class="expense-row">
                <label for="debts" class="label-box">
                    <img src="./IMages/Credit card.svg">
                    <span>Debts (Credit, Student Loans, etc)</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter debt(s)">
            </div>

            <div class="expense-row">
                <label for="media" class="label-box">
                    <img src="./IMages/Media.svg">
                    <span>Media</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter media subscriptions">
            </div>

            <div class="expense-row">
                <label for="Entertainment" class="label-box">
                    <img src="./IMages/Television.svg">
                    <span>Entertainment</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter entertainment purchases">
            </div>

            <div class="expense-row">
                <label for="other" class="label-box">
                    <img src="./IMages/Other.svg">
                    <span>Other</span>
                </label>
                <input type="number" class="expense-input" placeholder="Please enter any other mandatory purchase">
            </div>

            <a href="results.html" class="Btn">Done</a>
        </form>
    </section>
    <!--Add Done Button-->
</body>

</html>
